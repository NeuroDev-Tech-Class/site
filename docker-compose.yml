name: tech-class-website

# The Astro site (web/). The whole repo is mounted because the build reads ../content and ../images.
# Its API is the hub's backend: run `docker compose up` in ../neurodev-hub first (backend on 8001, Mailpit on 8026).
services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - web_node_modules:/app/web/node_modules
      # Generated, so kept off the Windows bind mount, which is slow to write and read: the build output and the
      # images and starter zips the build copies in
      - web_dist:/app/web/dist
      - web_public_images:/app/web/public/images
      - web_public_starters:/app/web/public/starters
    ports:
      - "4321:4321"
    environment:
      PUBLIC_API_URL: http://localhost:8001
      ASTRO_TELEMETRY_DISABLED: "1"

volumes:
  web_node_modules:
  web_dist:
  web_public_images:
  web_public_starters:
