<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/site/" />
    <script src="assets/js/load-head.js" defer></script>
  </head>

  <body>
    <header></header>
    <script src="/site/assets/js/load-header.js" type="module"></script>

    <main id="main-content" class="embed-page">
      <div class="embed-page-header">
        <button class="embed-back-btn" onclick="history.back()">← Back to Course</button>
        <h1 id="embed-title" class="embed-page-title"></h1>
      </div>
      <div class="form-frame-container">
        <iframe id="form-iframe" loading="lazy"></iframe>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="assets/js/load-footer.js" defer></script>
    <script type="module">
      import { requireApproval } from '/site/assets/js/content-guard.js';

      const params = new URLSearchParams(window.location.search);
      const url   = params.get('url')  || '';
      const title = params.get('title') || 'Test';

      document.getElementById('embed-title').textContent = title;
      document.title = title + ' — NeuroDev';

      // Iframe src is only set once the user is confirmed approved
      requireApproval(() => {
        if (!url) return;
        let parsed;
        try { parsed = new URL(url); } catch (e) { return; }
        // Only allow Google Forms over HTTPS
        if (parsed.protocol !== 'https:' ||
            parsed.hostname !== 'docs.google.com' ||
            !parsed.pathname.startsWith('/forms/')) return;
        document.getElementById('form-iframe').src =
          parsed.origin + parsed.pathname + '?embedded=true';
      });
    </script>
  </body>
</html>
