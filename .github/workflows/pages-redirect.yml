name: Pages redirect

# Cutover only (docs/CUTOVER.md): replaces the old GitHub Pages site with one page that sends every old address
# (neurodev-tech-class.github.io/site/...) to its page on tech.neurodevmentoring.com. Needs Settings > Pages >
# Source set to "GitHub Actions" first. Run by hand; nothing triggers it.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the redirect page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node web/scripts/pages-redirect.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Publish it to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
