name: CI

# The site's checks: the web/ app and the exercises. They run on every pull request into main and every push to it;
# "Web CI" and "Exercises CI" are the checks a PR shows. Render deploys main by itself; nothing here deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built site passes its checks
        run: npm run test:build

  exercises:
    name: Exercises CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: The exercises and their checker are well formed
        run: npm test
      - name: Every exercise's tests install and run
        run: npm run test:exercises
