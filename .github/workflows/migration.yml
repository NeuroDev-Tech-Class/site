name: Migration

# The new site's checks (the Render rewrite): the extractor and content/, the web/ app, and the exercises.
# They run on every pull request into main or render-migration and every push to them; "Extractor CI",
# "Web CI" and "Exercises CI" are the checks a PR shows. Render deploys main by itself; nothing here deploys.
# The old Firebase site keeps its own checks and deploy in ci.yml until cutover.
on:
  push:
    branches: [main, render-migration]
  pull_request:
    branches: [main, render-migration]

jobs:
  extract:
    name: Extractor CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:extract
      - name: content/ matches what the extractor generates
        run: npm run extract -- --check

  web:
    name: Web CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built site passes its checks
        run: npm run test:build

  exercises:
    name: Exercises CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Every exercise's tests install and run
        run: npm run test:exercises
