<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/site/" />
    <script src="assets/js/load-head.js" defer></script>
  </head>

  <body>
    <header></header>
    <script src="/site/assets/js/load-header.js" type="module"></script>

    <main id="main-content" class="embed-page">
      <div class="embed-page-header">
        <button class="embed-back-btn" onclick="history.back()">← Back to Course</button>
        <h1 id="embed-title" class="embed-page-title"></h1>
      </div>
      <div class="slides-frame-container">
        <iframe id="slides-iframe" allowfullscreen></iframe>
        <div class="spinner-overlay"><div class="spinner"></div></div>
      </div>
    </main>

    <div id="footer-placeholder"></div>
    <script src="assets/js/load-footer.js" defer></script>
    <script type="module">
      import { requireApproval } from '/site/assets/js/content-guard.js';

      const params = new URLSearchParams(window.location.search);
      const url   = params.get('url')   || '';
      const title = params.get('title') || 'Slideshow';

      document.getElementById('embed-title').textContent = title;
      document.title = title + ' — NeuroDev';

      const iframe = document.getElementById('slides-iframe');
      const hideSpinner = () => document.querySelector('.spinner-overlay')?.remove();

      // Iframe src is only set once the user is confirmed approved
      requireApproval(() => {
        setTimeout(hideSpinner, 10000);
        if (url) {
          const match = url.match(/\/presentation\/(?:u\/\d+\/)?d\/([a-zA-Z0-9_-]+)/);
          if (match) {
            iframe.addEventListener('load', hideSpinner, { once: true });
            iframe.src =
              `https://docs.google.com/presentation/d/${match[1]}/embed?start=false&loop=false&delayms=5000`;
          }
        }
      });
    </script>
  </body>
</html>
