<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/site/" />
    <script src="assets/js/load-head.js" defer></script>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>

  <body>
    <header></header>
    <script src="/site/assets/js/load-header.js" type="module"></script>

    <main id="main-content" class="dashboard">
      <div class="dashboard-header">
        <h1>My Progress</h1>
        <p class="dashboard-subtitle" id="welcome-message">Welcome back!</p>
      </div>

      <!-- Stats Overview -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-icon courses-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="courses-started">0</span>
            <span class="stat-label">Courses Started</span>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon completed-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="courses-completed">0</span>
            <span class="stat-label">Courses Completed</span>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon cert-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="certificates-earned">0</span>
            <span class="stat-label">Certificates Earned</span>
          </div>
        </div>
        
        <div class="stat-card">
          <div class="stat-icon tasks-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14H6v-2h6v2zm4-4H6v-2h10v2zm0-4H6V7h10v2z"/>
            </svg>
          </div>
          <div class="stat-content">
            <span class="stat-value" id="tasks-completed">0</span>
            <span class="stat-label">Tasks Completed</span>
          </div>
        </div>
      </div>

      <!-- Current Courses -->
      <section class="dashboard-section">
        <h2>My Courses</h2>
        <div id="courses-container" class="courses-grid">
          <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading your courses...</p>
          </div>
        </div>
      </section>

      <!-- Certificates -->
      <section class="dashboard-section">
        <h2>My Certificates</h2>
        <div id="certificates-container" class="certificates-grid">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="currentColor" width="48" height="48">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <p>Complete courses to earn certificates!</p>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
    <script src="assets/js/load-footer.js" defer></script>
    <script src="assets/js/profile.js" type="module"></script>
  </body>
</html>
